name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskly
          POSTGRES_PASSWORD: taskly
          POSTGRES_DB: taskly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskly -d taskly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://taskly:taskly@localhost:5432/taskly
      TEST_DATABASE_URL: postgresql+asyncpg://taskly:taskly@localhost:5432/taskly_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create test database
        env:
          PGPASSWORD: taskly
        run: psql -h localhost -U taskly -d taskly -c 'CREATE DATABASE taskly_test;'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy app tests

      - name: Pytest
        run: pytest
