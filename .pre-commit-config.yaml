# Runs ruff (lint + format) and mypy before each commit.
# Scoped to the backend/ package since that is the only code today.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff (format)
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^backend/
        args: ["--config-file", "backend/pyproject.toml", "backend/app", "backend/tests"]
